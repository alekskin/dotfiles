# Set true color
set -ag terminal-overrides ",xterm-256color:RGB"
set-option -sa terminal-overrides ",xterm*:Tc"

# Set prefix
unbind C-b
set -g prefix C-c
bind C-c send-prefix

# Navigate windows. M stands for Shift+Alt
bind -n M-H previous-window
bind -n M-L next-window

# Call tmux-sessionizer script
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer.sh"

# Open alacritty config
bind-key -r a run-shell "tmux neww ~/.local/scripts/alacritty-config.sh"

# Start window indexes from 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Remap split keys
bind | split-window -h
bind _ split-window -v

# Open new panes on the same path as splitted one
bind  |  split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Toggle status line (2 = status line plus the gap line above it)
bind-key b if-shell -F '#{==:#{status},off}' 'set-option status 2' 'set-option status off'

# Enable mouse
setw -g mouse on

# Enable vi copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Pane border colors
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour166"
# Status bar configuration
set -g status-position bottom
# Two status lines: line 0 is left empty to act as a gap above the real one.
# Reset the whole array to defaults first so re-sourcing stays idempotent
# (unsetting a single index does not restore its default).
set -g status 2
set -gu status-format
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' ''
set -g status-justify left
set -g status-style "bg=default,fg=colour240"
# Window status format
set -g window-status-format " #I:#W#{?window_zoomed_flag, 󰇙,} "
set -g window-status-current-format " #I:#W#{?window_zoomed_flag, 󰇙,} "
set -g window-status-style "fg=colour240"
set -g window-status-current-style "fg=black,bg=green"
# Leader key indicator (dot in bottom left)
set -g status-left-length 10
set -g status-left "#{?client_prefix,#[fg=green]●,#[fg=colour240]●} "
# Remove status bar elements for minimalism
set -g status-right "#[fg=black,bright]#S"
# Terminal title
set -g set-titles on
set -g set-titles-string "#T"

# ASCII borders
# set -g pane-border-lines simple
# set -g pane-border-style fg=black,bright
# set -g pane-active-border-style fg=colour166


# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.config/tmux/plugins/tpm/tpm'
