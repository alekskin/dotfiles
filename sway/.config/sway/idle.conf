# Idle / lock timeouts (seconds). 0 = disabled.
# Tweaked via: Super+Ctrl+Shift+I  (or run scripts/idle-menu.sh)
# Omarchy defaults (hypridle): screensaver 150s, lock 152s, then dim display.
# We map: dim → lock → blank; no auto-suspend (Omarchy doesn't suspend on idle).

DIM_SEC=120
DIM_PERCENT=15
LOCK_SEC=150
BLANK_SEC=153
SUSPEND_SEC=0
